<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 예산 현황 및 취합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 700; }
        
        /* 로딩 오버레이 스타일 */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid rgba(37, 99, 235, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 한줄 요약 카드 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="p-4 md:p-8 relative text-gray-800">

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay">
        <div class="spinner mb-4"></div>
        <p class="text-gray-700 font-semibold" id="loadingText">데이터를 불러오는 중입니다...</p>
    </div>

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center pt-2 pb-4">
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">📊 팀 예산 관리 시스템</h1>
            <p class="text-gray-500 mt-2 text-sm md:text-base">부장님 보고용 월별 예산 취합 및 대시보드</p>
        </header>

        <!-- AI/스마트 지출 분석 한줄 요약 배너 -->
        <div class="card p-5 bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-lg relative overflow-hidden">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                <div class="flex items-start gap-3">
                    <span class="text-2xl p-2 bg-blue-500/20 rounded-xl border border-blue-400/30">💡</span>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="text-sm font-semibold tracking-wide text-blue-300 uppercase">예산 지출 핵심 요약</h2>
                            <span class="text-[10px] bg-blue-500/30 text-blue-200 px-2 py-0.5 rounded-full border border-blue-400/30">보고용</span>
                        </div>
                        <p id="oneLineSummaryText" class="text-base md:text-lg font-medium text-slate-100 mt-1">
                            버튼을 눌러 현재 지출 내역의 가장 큰 특징을 요약해 보세요.
                        </p>
                    </div>
                </div>
                <button onclick="generateOneLineSummary()" 
                        class="px-5 py-2.5 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2 shrink-0 border border-blue-400/40">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    지출 특징 한줄 요약
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-gray-200">
            <button onclick="switchTab('input')" id="tab-input" class="px-6 py-3 font-semibold transition-colors tab-active flex items-center gap-2">
                <span>📝</span> 데이터 입력
            </button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-6 py-3 font-semibold text-gray-500 hover:text-blue-600 transition-colors flex items-center gap-2">
                <span>📈</span> 전체 대시보드
            </button>
        </div>

        <!-- Section 1: Input Form -->
        <div id="section-input" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 card p-6 border border-gray-100">
                <h2 class="text-xl font-bold mb-4 flex items-center text-gray-800">
                    <span class="mr-2">📝</span> 내역 입력
                </h2>
                <form id="budgetForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">팀원 선택</label>
                        <select id="member" class="mt-1 block w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                            <option value="">팀원을 선택하세요</option>
                            <option value="부장님">부장님</option>
                            <option value="팀원1">팀원1</option>
                            <option value="팀원2">팀원2</option>
                            <option value="팀원3">팀원3</option>
                            <option value="팀원4">팀원4</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">해당 월</label>
                        <input type="month" id="month" class="mt-1 block w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">예산 항목</label>
                        <select id="category" class="mt-1 block w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                            <option value="수선유지비">수선유지비</option>
                            <option value="비품">비품</option>
                            <option value="개량공사">개량공사</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">사용 금액 (원)</label>
                        <input type="number" id="amount" placeholder="숫자만 입력" min="1" class="mt-1 block w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
                        기록 저장하기
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 card p-6 border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold flex items-center text-gray-800">
                        <span class="mr-2">📂</span> 최근 입력 내역
                    </h2>
                    <div class="space-x-3">
                        <button onclick="fetchData()" class="text-xs text-blue-600 hover:text-blue-800 font-medium hover:underline">🔄 새로고침</button>
                        <button onclick="confirmClearData()" class="text-xs text-red-500 hover:text-red-700 font-medium hover:underline">🗑️ 모든 데이터 초기화</button>
                    </div>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">날짜</th>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">팀원</th>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">항목</th>
                                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">금액</th>
                                <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">삭제</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody" class="bg-white divide-y divide-gray-100">
                            <!-- JS dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Section 2: Dashboard (Hidden by default) -->
        <div id="section-dashboard" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card p-6 bg-blue-50 border border-blue-100">
                    <p class="text-xs font-semibold text-blue-600 uppercase tracking-wider">전체 누적 사용액</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-blue-900 mt-2">0원</h3>
                </div>
                <div class="card p-6 bg-emerald-50 border border-emerald-100">
                    <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">최대 사용 항목</p>
                    <h3 id="stat-top-category" class="text-xl font-bold text-emerald-900 mt-2">-</h3>
                </div>
                <div class="card p-6 bg-purple-50 border border-purple-100">
                    <p class="text-xs font-semibold text-purple-600 uppercase tracking-wider">데이터 건수</p>
                    <h3 id="stat-count" class="text-3xl font-bold text-purple-900 mt-2">0건</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card p-6 border border-gray-100">
                    <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center">
                        <span class="mr-2">🍩</span> 항목별 예산 분포
                    </h2>
                    <div class="relative h-64 flex items-center justify-center">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div class="card p-6 border border-gray-100">
                    <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center">
                        <span class="mr-2">👥</span> 팀원별 누적 사용액
                    </h2>
                    <div class="relative h-64 flex items-center justify-center">
                        <canvas id="memberChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="card p-6 overflow-x-auto border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center">
                    <span class="mr-2">📅</span> 월별/항목별 요약 테이블 (취합본)
                </h2>
                <table class="min-w-full border-collapse border border-gray-200 text-sm">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="border border-gray-200 px-4 py-2.5 text-gray-700">연월</th>
                            <th class="border border-gray-200 px-4 py-2.5 text-blue-600">수선유지비</th>
                            <th class="border border-gray-200 px-4 py-2.5 text-emerald-600">비품</th>
                            <th class="border border-gray-200 px-4 py-2.5 text-purple-600">개량공사</th>
                            <th class="border border-gray-200 px-4 py-2.5 bg-gray-200 text-gray-800 font-bold">합계</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="text-center">
                        <!-- JS dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlert" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full animate-fade-in border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-2" id="alertTitle">알림</h3>
            <p id="alertMsg" class="text-gray-600 text-sm mb-5 leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-sm">확인</button>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="customConfirm" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full animate-fade-in border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-2" id="confirmTitle">확인</h3>
            <p id="confirmMsg" class="text-gray-600 text-sm mb-5 leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirm(false)" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold text-sm transition-colors">취소</button>
                <button id="confirmOkBtn" onclick="closeConfirm(true)" class="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-sm">확인</button>
            </div>
        </div>
    </div>

    <script>
        // Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_I_E2tuyBPp8KZm7J5J9xhVYMXdusaCwlYFuop1z9dmz3wNAHDLZ7IfGDy-qvWYXe/exec'; 
        
        // State Management
        let budgetData = [];
        let categoryChart = null;
        let memberChart = null;
        let confirmResolver = null;
        let summaryIndex = 0;

        // UI Loading Helpers
        function showLoading(text = '처리 중...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Custom Modal Controls
        function showAlert(title, msg) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        function showConfirm(title, msg) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMsg').innerText = msg;
            document.getElementById('customConfirm').classList.remove('hidden');
            return new Promise((resolve) => {
                confirmResolver = resolve;
            });
        }

        function closeConfirm(result) {
            document.getElementById('customConfirm').classList.add('hidden');
            if (confirmResolver) {
                confirmResolver(result);
                confirmResolver = null;
            }
        }

        // Fetch data from Google Sheets API
        async function fetchData() {
            if (!SCRIPT_URL || SCRIPT_URL.includes('YOUR_GOOGLE')) {
                showAlert('설정 오류', 'Google Apps Script URL을 올바르게 설정해주세요.');
                renderHistory();
                return;
            }

            showLoading('데이터를 불러오는 중입니다...');
            try {
                const response = await fetch(SCRIPT_URL + "?action=read");
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.status === 'success') {
                    budgetData = result.data.map(row => ({
                        id: row.id || Date.now().toString(),
                        member: row.member,
                        month: row.month,
                        category: row.category,
                        amount: parseInt(row.amount) || 0
                    }));
                    renderHistory();
                    if (!document.getElementById('section-dashboard').classList.contains('hidden')) {
                        updateDashboard();
                    }
                    // 새로고침 시 요약 메시지 자동 갱신
                    generateOneLineSummary(true);
                } else {
                    showAlert('오류', '데이터를 불러오는데 실패했습니다: ' + result.message);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showAlert('통신 오류', '서버와 통신 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        // 핵심 지출 내역 한줄 요약 기능
        function generateOneLineSummary(auto = false) {
            const summaryElem = document.getElementById('oneLineSummaryText');
            
            if (!budgetData || budgetData.length === 0) {
                summaryElem.innerText = "등록된 예산 지출 내역이 없습니다. 먼저 데이터를 등록해주세요.";
                return;
            }

            const totalAmount = budgetData.reduce((sum, item) => sum + item.amount, 0);

            // 1. 항목별 집계
            const categoryTotals = budgetData.reduce((acc, item) => {
                acc[item.category] = (acc[item.category] || 0) + item.amount;
                return acc;
            }, {});

            // 2. 팀원별 집계
            const memberTotals = budgetData.reduce((acc, item) => {
                acc[item.member] = (acc[item.member] || 0) + item.amount;
                return acc;
            }, {});

            // 3. 월별 집계
            const monthTotals = budgetData.reduce((acc, item) => {
                acc[item.month] = (acc[item.month] || 0) + item.amount;
                return acc;
            }, {});

            // 최대 지출 항목 / 팀원 / 월 산출
            const topCategory = Object.keys(categoryTotals).reduce((a, b) => categoryTotals[a] > categoryTotals[b] ? a : b, '');
            const topCategoryAmount = categoryTotals[topCategory] || 0;
            const topCategoryPercent = Math.round((topCategoryAmount / totalAmount) * 100);

            const topMember = Object.keys(memberTotals).reduce((a, b) => memberTotals[a] > memberTotals[b] ? a : b, '');
            const topMemberAmount = memberTotals[topMember] || 0;
            const topMemberPercent = Math.round((topMemberAmount / totalAmount) * 100);

            const topMonth = Object.keys(monthTotals).reduce((a, b) => monthTotals[a] > monthTotals[b] ? a : b, '');
            const topMonthAmount = monthTotals[topMonth] || 0;

            // 관점별 요약 문구 생성 리스트
            const summaries = [
                `총 지출액 ${totalAmount.toLocaleString()}원 중 '${topCategory}' 항목이 ${topCategoryPercent}%(${topCategoryAmount.toLocaleString()}원)로 가장 높은 지출 비중을 차지하고 있습니다.`,
                `팀원별 지출 분석 결과, '${topMember}' 님이 총 예산의 ${topMemberPercent}%(${topMemberAmount.toLocaleString()}원)를 집행하여 최다 집행 인원으로 나타났습니다.`,
                `월별 지출 흐름 분석 시, '${topMonth}'에 ${topMonthAmount.toLocaleString()}원이 집행되어 단일 월 기준 최대 예산 소진을 기록했습니다.`,
                `총 ${budgetData.length}건의 집행 내역 중 '${topCategory}'(${topCategoryPercent}%) 항목과 '${topMember}' 님(${topMemberPercent}%)이 주요 예산 집행 포인트입니다.`
            ];

            if (auto) {
                summaryElem.innerText = summaries[0];
            } else {
                summaryIndex = (summaryIndex + 1) % summaries.length;
                summaryElem.classList.remove('animate-fade-in');
                void summaryElem.offsetWidth; // trigger reflow
                summaryElem.innerText = summaries[summaryIndex];
                summaryElem.classList.add('animate-fade-in');
            }
        }

        // Tab Switching
        function switchTab(tab) {
            const sections = ['input', 'dashboard'];
            sections.forEach(s => {
                document.getElementById(`section-${s}`).classList.add('hidden');
                document.getElementById(`tab-${s}`).classList.remove('tab-active');
                document.getElementById(`tab-${s}`).classList.add('text-gray-500');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-500');

            if (tab === 'dashboard') {
                updateDashboard();
            }
        }

        // Form Submission
        document.getElementById('budgetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!SCRIPT_URL || SCRIPT_URL.includes('YOUR_GOOGLE')) {
                showAlert('설정 오류', 'Google Apps Script URL이 설정되지 않았습니다.');
                return;
            }
            
            const newEntry = {
                id: Date.now().toString(),
                member: document.getElementById('member').value,
                month: document.getElementById('month').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value
            };

            showLoading('데이터를 저장하는 중입니다...');
            
            try {
                const formData = new FormData();
                formData.append('action', 'insert');
                formData.append('id', newEntry.id);
                formData.append('member', newEntry.member);
                formData.append('month', newEntry.month);
                formData.append('category', newEntry.category);
                formData.append('amount', newEntry.amount);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    newEntry.amount = parseInt(newEntry.amount);
                    budgetData.unshift(newEntry);
                    renderHistory();
                    this.reset();
                    
                    const now = new Date();
                    document.getElementById('month').value = now.toISOString().substring(0, 7);
                    showAlert('성공', '예산 데이터가 성공적으로 저장되었습니다.');
                    generateOneLineSummary(true);
                } else {
                    showAlert('저장 실패', result.message);
                }
            } catch (error) {
                console.error('Error saving data:', error);
                showAlert('통신 오류', '데이터 저장 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        });

        // Delete entry with custom confirmation modal
        async function deleteEntry(id) {
            const confirmed = await showConfirm('내역 삭제', '이 지출 내역을 정말 삭제하시겠습니까?');
            if (!confirmed) return;
            
            showLoading('삭제 중...');
            try {
                const formData = new FormData();
                formData.append('action', 'delete');
                formData.append('id', id);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    budgetData = budgetData.filter(item => item.id.toString() !== id.toString());
                    renderHistory();
                    showAlert('성공', '삭제되었습니다.');
                    generateOneLineSummary(true);
                } else {
                    showAlert('삭제 실패', result.message);
                }
            } catch (error) {
                console.error('Error deleting data:', error);
                showAlert('통신 오류', '삭제 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        // Clear all data with custom confirmation modal
        async function confirmClearData() {
            const confirmed = await showConfirm('전체 삭제 확인', '정말로 모든 데이터를 삭제하시겠습니까? (이 작업은 되돌릴 수 없습니다.)');
            if (!confirmed) return;

            showLoading('전체 데이터 삭제 중...');
            try {
                const formData = new FormData();
                formData.append('action', 'clearAll');

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    budgetData = [];
                    renderHistory();
                    showAlert('성공', '모든 데이터가 초기화되었습니다.');
                    generateOneLineSummary(true);
                } else {
                    showAlert('초기화 실패', result.message);
                }
            } catch (error) {
                console.error('Error clearing data:', error);
                showAlert('통신 오류', '초기화 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        function renderHistory() {
            const body = document.getElementById('historyBody');
            body.innerHTML = budgetData.map(item => `
                <tr class="hover:bg-gray-50/80 transition-colors">
                    <td class="px-4 py-3 text-sm text-gray-600 font-medium">${item.month}</td>
                    <td class="px-4 py-3 text-sm font-semibold text-gray-800">${item.member}</td>
                    <td class="px-4 py-3 text-sm">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold 
                            ${item.category === '수선유지비' ? 'bg-blue-100 text-blue-800' : 
                              item.category === '비품' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'}">
                            ${item.category}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-sm text-right font-semibold font-mono text-gray-900">${item.amount.toLocaleString()}원</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteEntry('${item.id}')" class="text-gray-400 hover:text-red-600 transition-colors p-1" title="삭제">
                            🗑️
                        </button>
                    </td>
                </tr>
            `).join('');
            
            if (budgetData.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-gray-400 text-sm">등록된 예산 내역이 없습니다.</td></tr>`;
            }
        }

        // Dashboard Updates
        function updateDashboard() {
            const total = budgetData.reduce((acc, curr) => acc + curr.amount, 0);
            document.getElementById('stat-total').innerText = total.toLocaleString() + '원';
            document.getElementById('stat-count').innerText = budgetData.length + '건';

            const catMap = budgetData.reduce((acc, curr) => {
                acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
                return acc;
            }, {});
            
            const topCategory = Object.keys(catMap).reduce((a, b) => catMap[a] > catMap[b] ? a : b, '-');
            document.getElementById('stat-top-category').innerText = topCategory !== '-' ? `${topCategory} (${catMap[topCategory].toLocaleString()}원)` : '-';

            renderCharts(catMap);
            renderSummaryTable();
        }

        function renderCharts(catMap) {
            const catCtx = document.getElementById('categoryChart').getContext('2d');
            const memCtx = document.getElementById('memberChart').getContext('2d');

            if (categoryChart) categoryChart.destroy();
            if (memberChart) memberChart.destroy();

            categoryChart = new Chart(catCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    cutout: '70%' 
                }
            });

            const memMap = budgetData.reduce((acc, curr) => {
                acc[curr.member] = (acc[curr.member] || 0) + curr.amount;
                return acc;
            }, {});

            memberChart = new Chart(memCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(memMap),
                    datasets: [{
                        label: '사용 금액 (원)',
                        data: Object.values(memMap),
                        backgroundColor: '#60a5fa',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#f3f4f6' } }, x: { grid: { display: false } } }
                }
            });
        }

        function renderSummaryTable() {
            const tableBody = document.getElementById('summaryTableBody');
            const monthlyData = {};

            budgetData.forEach(item => {
                if (!monthlyData[item.month]) {
                    monthlyData[item.month] = { '수선유지비': 0, '비품': 0, '개량공사': 0, total: 0 };
                }
                monthlyData[item.month][item.category] += item.amount;
                monthlyData[item.month].total += item.amount;
            });

            const sortedMonths = Object.keys(monthlyData).sort((a, b) => b.localeCompare(a));

            tableBody.innerHTML = sortedMonths.map(month => {
                const row = monthlyData[month];
                return `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="border border-gray-200 px-4 py-2.5 font-medium text-gray-800">${month}</td>
                        <td class="border border-gray-200 px-4 py-2.5 font-mono text-gray-700">${row['수선유지비'].toLocaleString()}</td>
                        <td class="border border-gray-200 px-4 py-2.5 font-mono text-gray-700">${row['비품'].toLocaleString()}</td>
                        <td class="border border-gray-200 px-4 py-2.5 font-mono text-gray-700">${row['개량공사'].toLocaleString()}</td>
                        <td class="border border-gray-200 px-4 py-2.5 bg-gray-50 font-bold font-mono text-blue-900">${row.total.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
            
            if (sortedMonths.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-gray-400">데이터가 없습니다.</td></tr>`;
            }
        }

        // Initialization
        window.onload = function() {
            const now = new Date();
            const monthStr = now.toISOString().substring(0, 7);
            document.getElementById('month').value = monthStr;
            fetchData();
        }
    </script>
</body>
</html>
